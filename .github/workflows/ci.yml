# Tests the backend, lint + full frontend build on Linux, macOS and Windows, then builds and smoke-tests
# the Docker stack. Any failure blocks the merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.lock
      # uv (Rust) installs the hash-verified lock: CI tests exactly what the Docker image ships
      - run: python -m pip install uv==0.13.7
      - run: uv pip install --system --require-hashes -r requirements-dev.lock
      - name: lockfiles match requirements*.txt
        if: runner.os == 'Linux'
        run: |
          uv pip compile --universal --python-version 3.13 --generate-hashes -q requirements.txt -o requirements.lock
          uv pip compile --universal --python-version 3.13 --generate-hashes -q requirements-dev.txt -o requirements-dev.lock
          git diff --exit-code requirements.lock requirements-dev.lock
      - run: ruff check .
      - run: python -m pytest

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --audit-level=moderate

  frontend:
    name: frontend · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # full pipeline: vite build, SSR prerender (layout verified at 18 viewports), br/gz, Caddy CSP
      - run: npm run build
      - name: CSP hash in deploy/ matches the committed one
        if: runner.os == 'Linux'
        run: git diff --exit-code deploy/security-headers.caddy

  docker:
    name: docker · build + smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: HTTP_PORT=8080 HTTPS_PORT=8443 docker compose up -d --wait --wait-timeout 90
      - name: smoke test through Caddy
        run: |
          set -e
          code() { curl -s -o /dev/null -w '%{http_code}' -H 'Accept-Encoding: br, gzip' "http://localhost:8080$1"; }
          test "$(code /)" = 200
          test "$(code /api/status)" = 200
          test "$(code /assets/no-existe.js)" = 404
          test "$(code /img/README.md)" = 404
          # granian always sends "server: granian"; Caddy must strip it
          ! curl -sI http://localhost:8080/api/status | grep -qi '^server:'
          curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@example.com","message":"smoke"}' http://localhost:8080/api/contact | grep -q 200
      - if: always()
        run: docker compose logs --no-color && docker compose down -v

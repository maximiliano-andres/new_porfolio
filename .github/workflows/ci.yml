# Tests the backend, lint + full frontend build on Linux, macOS and Windows, then builds and smoke-tests
# the Docker stack. Any failure blocks the merge.
# Actions are pinned by full commit SHA (a moved tag can't inject code); Dependabot (.github/dependabot.yml) bumps them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      # uv (Rust) installs the hash-verified lock: CI tests exactly what the Docker image ships
      - run: python -m pip install uv==0.13.7
      - run: uv pip install --system --require-hashes -r requirements-dev.lock
      - name: lockfiles match requirements*.txt
        if: runner.os == 'Linux'
        run: |
          uv pip compile --universal --python-version 3.13 --generate-hashes -q requirements.txt -o requirements.lock
          uv pip compile --universal --python-version 3.13 --generate-hashes -q requirements-dev.txt -o requirements-dev.lock
          git diff --exit-code requirements.lock requirements-dev.lock
      - run: ruff check .
      # unit (domain + use cases with test doubles) and integration (HTTP adapter end to end)
      - run: python -m pytest

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install pip-audit==2.10.1
      # runtime AND dev/CI tooling: a vulnerable pytest runs on every developer machine and CI runner too
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements.lock
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm audit --audit-level=moderate
        working-directory: frontend

  frontend:
    name: frontend · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # full pipeline: vite build, SSR prerender (layout verified at 18 viewports), br/gz, Caddy CSP
      - run: npm run build
      - name: CSP hash in deploy/ matches the committed one
        if: runner.os == 'Linux'
        run: git diff --exit-code ../deploy/security-headers.caddy

  docker:
    name: docker · build + smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose build
      - run: HTTP_PORT=8080 HTTPS_PORT=8443 docker compose up -d --wait --wait-timeout 90
      - name: smoke test through Caddy
        run: |
          set -e
          code() { curl -s -o /dev/null -w '%{http_code}' -H 'Accept-Encoding: br, gzip' "http://localhost:8080$1"; }
          test "$(code /)" = 200
          test "$(code /api/status)" = 200
          test "$(code /assets/no-existe.js)" = 404
          test "$(code /img/README.md)" = 404
          # granian always sends "server: granian"; Caddy must strip it
          ! curl -sI http://localhost:8080/api/status | grep -qi '^server:'
          curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@example.com","message":"smoke"}' http://localhost:8080/api/contact | grep -q 200
          # CV: the real PDF as a PDF and always revalidated (same policy as the backend); a missing one is an honest
          # 404, never the HTML shell (DEP-8)
          hdr() { curl -s -o /dev/null -D - "http://localhost:8080$1" | tr -d '\r'; }
          cv=$(hdr /cv/CV_Maximiliano_Caniullan.pdf)
          echo "$cv" | grep -q '^HTTP/[0-9.]* 200'
          echo "$cv" | grep -qi '^content-type: application/pdf'
          echo "$cv" | grep -qi '^cache-control: no-cache'
          old=$(hdr /cv/viejo.pdf)
          echo "$old" | grep -q '^HTTP/[0-9.]* 404'
          ! echo "$old" | grep -qi '^content-type: text/html'
          echo "$old" | grep -qi '^x-content-type-options: nosniff'   # handle_errors keeps the security headers
          # HSTS (gradual max-age from config/security-headers.json) and the access log on stdout
          hdr / | grep -qi '^strict-transport-security: max-age='
          docker compose logs web | grep -q '"logger":"http.log.access'
          # Caddy runs as a non-root user
          test "$(docker compose exec -T web id -u)" != 0
      - if: always()
        run: docker compose logs --no-color && docker compose down -v
